name: Build Frontend for GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build static bundle
        run: |
          npm install
          npm run build

      - name: Commit updated GitHub Pages bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app.bundle.js app.bundle.css sw.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "Build static frontend bundle for GitHub Pages [skip ci]"
            git push
          fi
